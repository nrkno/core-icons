---
name: Setup CI
description: Sets up the CI environment for the project

inputs:
  skip-npm-cache:
    description: 'Skip npm cache'
    required: false
    default: 'true'
  download-dist:
    description: 'Download `dist/` artifact from previous job'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        registry-url: 'https://registry.npmjs.org'
        node-version-file: package.json
        package-manager-cache: ${{ inputs.skip-npm-cache != 'true' }}
        cache: ${{ inputs.skip-npm-cache != 'true' && 'npm' || '' }}

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Download dist artifact
      if: ${{ inputs.download-dist == 'true' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
