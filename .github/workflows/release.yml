name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_npm:
    name: Create release pull request or publish to npm
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: ./.github/actions/setup

      - name: Run tests
        run: npm run test

      - name: Create release pull request or publish to npm
        id: changesets
        uses: changesets/action@v1.9.0
        with:
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Deploy docs
      #   if: ${{ steps.changesets.outputs.published == 'true' }}
      #   run: |
      #     npx @nrk/static-publish-cli -- \
      #       --directory=static \
      #       --latest \
      #       --major
      #   env:
      #     STATIC_NETSTORAGE_API_ACCOUNT: ${{ secrets.STATIC_NETSTORAGE_API_ACCOUNT }}
      #     STATIC_NETSTORAGE_API_KEY: ${{ secrets.STATIC_NETSTORAGE_API_KEY }}

  release_android:
    name: Publish Android library
    runs-on: ubuntu-latest
    needs: [release_npm]
    if: ${{ needs.release_npm.outputs.published == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Publish
        working-directory: android
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
